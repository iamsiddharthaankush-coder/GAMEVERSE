
name: Build GAMEVERSE APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        run: |
          ZIP=$(find . -maxdepth 2 -name 'GAMEVERSE-Android-Studio-Source.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GAMEVERSE-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
